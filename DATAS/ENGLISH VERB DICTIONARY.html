<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Verb Dictionary - Offline</title>
    <style>
        :root {
            --bg-color: #F4F8FB;
            --header-bg: #0B3C5D;
            --text-main: #333333;
            --col-v1-bg: #E8F4F8;
            --col-v2-bg: #F8EEE8;
            --col-v3-bg: #E8F8EC;
            --btn-bg: #328CC1;
            --btn-hover: #1D2731;
            --border-color: #d0d7de;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "UTM Avo", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; /* Prevent body scroll, scroll only table */
        }

        header {
            background-color: var(--header-bg);
            color: white;
            text-align: center;
            padding: 12px 20px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-home-btn {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 8px 16px;
            background: rgba(255,255,255,0.18);
            border-radius: 8px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .header-home-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .controls-container {
            background-color: white;
            padding: 15px 20px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .search-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        input[type="text"] {
            width: 50%;
            max-width: 600px;
            padding: 12px 20px;
            font-size: 1.5rem;
            border: 2px solid var(--btn-bg);
            border-radius: 8px;
            outline: none;
            font-family: inherit;
        }

        input[type="text"]:focus {
            border-color: var(--header-bg);
        }

        button {
            padding: 12px 24px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            color: white;
            background-color: var(--btn-bg);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-clear {
            background-color: #D9534F;
        }
        .btn-clear:hover {
            background-color: #C9302C;
        }
        .btn-quiz {
            background-color: #F0AD4E;
            color: #fff;
        }
        .btn-quiz:hover {
            background-color: #EC971F;
        }

        .settings-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            background: var(--bg-color);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        input[type="range"] {
            cursor: pointer;
        }

        #table-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: var(--bg-color);
        }

        table {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            position: sticky;
            top: 0;
            background-color: var(--header-bg);
            color: white;
            font-size: 1.6rem;
            padding: 15px;
            text-align: left;
            z-index: 2;
            border-right: 1px solid rgba(255,255,255,0.2);
        }

        th:last-child {
            border-right: none;
        }

        td {
            padding: 15px;
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            vertical-align: middle;
        }

        td:last-child {
            border-right: none;
        }

        /* Column Colors */
        td:nth-child(1) { background-color: var(--col-v1-bg); }
        td:nth-child(2) { background-color: var(--col-v2-bg); }
        td:nth-child(3) { background-color: var(--col-v3-bg); }

        tr:hover td {
            filter: brightness(0.95);
        }

        .word-cell {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .speaker-btn {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 5px;
            color: var(--header-bg);
            border-radius: 50%;
            transition: transform 0.2s;
            line-height: 1;
        }

        .speaker-btn:hover {
            transform: scale(1.2);
            background-color: rgba(0,0,0,0.05);
        }

        .hidden-word {
            background-color: #ccc;
            color: #ccc;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            padding: 0 10px;
            transition: all 0.3s;
        }

        .hidden-word:hover::after {
            content: " (Click to reveal)";
            font-size: 1rem;
            color: #666;
        }

        .hidden-word.revealed {
            background-color: transparent;
            color: inherit;
        }
        .hidden-word.revealed:hover::after {
            content: "";
        }

        .no-result {
            text-align: center;
            font-size: 2rem;
            padding: 50px;
            color: #D9534F;
            font-weight: bold;
        }

        footer {
            background-color: var(--header-bg);
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 1.2rem;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            padding-left: 30px;
            padding-right: 30px;
        }

        /* Responsive for projector/TVs */
        @media (min-width: 1600px) {
            h1 { font-size: 2.8rem; }
            input[type="text"] { font-size: 1.8rem; }
            button { font-size: 1.4rem; }
            th { font-size: 1.8rem; }
            td { font-size: 1.8rem; }
            .speaker-btn { font-size: 2.2rem; }
        }
    </style>
</head>

    <header>
        <a href="../SIMPLE PAST.html" target="_top" class="header-home-btn" title="Quay về danh mục Simple Past">🏠 Trang Chủ</a>

        <div style="width: 120px;" class="header-spacer"></div>

    <div class="controls-container">
        <div class="search-row">
            <input type="text" id="searchInput" placeholder="Enter a verb (e.g., went, go, gone)..." autocomplete="off">
            <button class="btn-clear" onclick="clearSearch()">✖ CLEAR</button>
        </div>
        
        <div class="settings-row">
            <div class="speed-control">
                <label for="speed-slider">Speed:</label>
                <input type="range" id="speed-slider" min="0.5" max="1.2" step="0.05" value="0.85">
                <span id="speed-val">0.85x</span>
            </div>
            <button onclick="replayLast()">🔄 REPLAY</button>
            <button onclick="showRandom()">🎲 RANDOM</button>
            <button class="btn-quiz" onclick="startQuiz()">❓ VERB QUIZ</button>
            <button onclick="showAll()">📋 SHOW ALL</button>
        </div>
    </div>

    <div id="table-container">

            <tbody id="verbTableBody">
                <!-- Data will be populated here -->
            </tbody>
        </table>
        <div id="noResultMsg" class="no-result" style="display: none;">NO RESULT</div>
    </div>

    <footer>
        <span id="showingCount">Showing: 0</span>
        <span>Offline Dictionary</span>
        <span id="totalCount">Total verbs: 0</span>
    </footer>

            {v1: "pull", v2: "pulled", v3: "pulled"}, {v1: "push", v2: "pushed", v3: "pushed"},
            {v1: "rain", v2: "rained", v3: "rained"}, {v1: "reach", v2: "reached", v3: "reached"},
            {v1: "realize", v2: "realized", v3: "realized"}, {v1: "receive", v2: "received", v3: "received"},
            {v1: "remember", v2: "remembered", v3: "remembered"}, {v1: "repair", v2: "repaired", v3: "repaired"},
            {v1: "repeat", v2: "repeated", v3: "repeated"}, {v1: "reply", v2: "replied", v3: "replied"},
            {v1: "report", v2: "reported", v3: "reported"}, {v1: "rest", v2: "rested", v3: "rested"},
            {v1: "return", v2: "returned", v3: "returned"}, {v1: "save", v2: "saved", v3: "saved"},
            {v1: "seem", v2: "seemed", v3: "seemed"}, {v1: "shout", v2: "shouted", v3: "shouted"},
            {v1: "smile", v2: "smiled", v3: "smiled"}, {v1: "snow", v2: "snowed", v3: "snowed"},
            {v1: "solve", v2: "solved", v3: "solved"}, {v1: "sound", v2: "sounded", v3: "sounded"},
            {v1: "start", v2: "started", v3: "started"}, {v1: "stop", v2: "stopped", v3: "stopped"},
            {v1: "study", v2: "studied", v3: "studied"}, {v1: "talk", v2: "talked", v3: "talked"},
            {v1: "taste", v2: "tasted", v3: "tasted"}, {v1: "test", v2: "tested", v3: "tested"},
            {v1: "thank", v2: "thanked", v3: "thanked"}, {v1: "touch", v2: "touched", v3: "touched"},
            {v1: "travel", v2: "traveled", v3: "traveled"}, {v1: "try", v2: "tried", v3: "tried"},
            {v1: "turn", v2: "turned", v3: "turned"}, {v1: "use", v2: "used", v3: "used"},
            {v1: "visit", v2: "visited", v3: "visited"}, {v1: "wait", v2: "waited", v3: "waited"},
            {v1: "walk", v2: "walked", v3: "walked"}, {v1: "want", v2: "wanted", v3: "wanted"},
            {v1: "wash", v2: "washed", v3: "washed"}, {v1: "watch", v2: "watched", v3: "watched"},
            {v1: "wish", v2: "wished", v3: "wished"}, {v1: "work", v2: "worked", v3: "worked"},
            {v1: "worry", v2: "worried", v3: "worried"}
        ];

        // Sort verbs alphabetically by V1
        verbsData.sort((a, b) => a.v1.localeCompare(b.v1));

        let currentData = [...verbsData];
        let isQuizMode = false;
        let lastSpokenText = "";
        
        const tableBody = document.getElementById("verbTableBody");
        const searchInput = document.getElementById("searchInput");
        const speedSlider = document.getElementById("speed-slider");
        const speedVal = document.getElementById("speed-val");
        const noResultMsg = document.getElementById("noResultMsg");
        const tableElement = document.querySelector("table");
        const showingCount = document.getElementById("showingCount");
        const totalCount = document.getElementById("totalCount");

        // Initialize App
        document.addEventListener("DOMContentLoaded", () => {
            totalCount.textContent = `Total verbs: ${verbsData.length}`;
            renderTable(currentData);
        });

        // Search logic
        searchInput.addEventListener("input", (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query === "") {
                currentData = [...verbsData];
            } else {
                currentData = verbsData.filter(v => 
                    v.v1.toLowerCase().includes(query) || 
                    v.v2.toLowerCase().includes(query) || 
                    v.v3.toLowerCase().includes(query)
                );
            }
            isQuizMode = false;
            renderTable(currentData);
        });

        // Speed slider text update
        speedSlider.addEventListener("input", (e) => {
            speedVal.textContent = e.target.value + "x";
        });

        function clearSearch() {
            searchInput.value = "";
            currentData = [...verbsData];
            isQuizMode = false;
            renderTable(currentData);
            searchInput.focus();
        }

        function showRandom() {
            const randomVerb = verbsData[Math.floor(Math.random() * verbsData.length)];
            currentData = [randomVerb];
            isQuizMode = false;
            searchInput.value = "";
            renderTable(currentData);
        }

        function showAll() {
            searchInput.value = "";
            currentData = [...verbsData];
            isQuizMode = false;
            renderTable(currentData);
        }

        function startQuiz() {
            isQuizMode = true;
            renderTable(currentData);
        }

        function revealWord(element) {
            element.classList.add("revealed");
        }

        // Parse word to remove slashes (e.g. "was/were" -> "was") for speech synthesis
        function cleanForSpeech(word) {
            if (word.includes('/')) {
                return word.split('/')[0];
            }
            return word;
        }

        function speak(text) {
            if (!text) return;
            lastSpokenText = cleanForSpeech(text);
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop current speech
                const utterance = new SpeechSynthesisUtterance(lastSpokenText);
                utterance.lang = 'en-US';
                utterance.rate = parseFloat(speedSlider.value);
                
                // Try to use a specific US English voice if available
                const voices = window.speechSynthesis.getVoices();
                const usVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Google')) || 
                                voices.find(v => v.lang === 'en-US');
                if (usVoice) utterance.voice = usVoice;

                window.speechSynthesis.speak(utterance);
            } else {
                alert("Sorry, your browser doesn't support Text-to-Speech.");
            }
        }

        function replayLast() {
            if (lastSpokenText) {
                speak(lastSpokenText);
            }
        }

        // Chrome requires voices to load asynchronously
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }

        function renderTable(data) {
            tableBody.innerHTML = "";
            
            if (data.length === 0) {
                tableElement.style.display = "none";
                noResultMsg.style.display = "block";
                showingCount.textContent = `Showing: 0`;
                return;
            }

            tableElement.style.display = "table";
            noResultMsg.style.display = "none";
            showingCount.textContent = `Showing: ${data.length}`;

            data.forEach(verb => {
                const tr = document.createElement("tr");

                // Logic for Quiz Mode (Hide V2 or V3 randomly)
                let hideV2 = false;
                let hideV3 = false;
                if (isQuizMode) {
                    if (Math.random() > 0.5) hideV2 = true;
                    else hideV3 = true;
                }

                // Render Cells
                tr.innerHTML = `
                    <td>
                        <div class="word-cell">
                            <span>${verb.v1}</span>
                            <button class="speaker-btn" onclick="speak('${verb.v1}')" title="Pronounce">🔊</button>
                        </div>
                    </td>
                    <td>
                        <div class="word-cell">
                            <span class="${hideV2 ? 'hidden-word' : ''}" onclick="revealWord(this)">${verb.v2}</span>
                            <button class="speaker-btn" onclick="speak('${verb.v2}')" title="Pronounce">🔊</button>
                        </div>
                    </td>
                    <td>
                        <div class="word-cell">
                            <span class="${hideV3 ? 'hidden-word' : ''}" onclick="revealWord(this)">${verb.v3}</span>
                            <button class="speaker-btn" onclick="speak('${verb.v3}')" title="Pronounce">🔊</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
